name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.in

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          THREADS_APP_ID: test-app
          THREADS_APP_SECRET: test-secret
        run: pytest -q

      - name: Import smoke (server wires up without a credential)
        env:
          THREADS_APP_ID: test-app
          THREADS_APP_SECRET: test-secret
          THREADS_DATA_DIR: /tmp/threads-data
        run: |
          python -c "
          import asyncio, server
          tools = asyncio.run(server.mcp.list_tools())
          names = sorted(t.name for t in tools)
          assert len(names) == 13, names
          print('tools:', names)
          "

  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required on pull_request events, and only there. Without it the
          # action aborts before scanning anything: "GITHUB_TOKEN is now
          # required to scan pull requests." Every PR in this repo failed this
          # job while every push to main passed, so the scan was silently
          # main-only and the red X on each PR meant nothing was checked.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The scan above is only trustworthy if it can fail. Plant a synthetic
      # Threads-shaped token, assert the ruleset catches it, then remove it.
      # A scan harness without a positive control proves nothing.
      - name: Install gitleaks for the control check
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Positive control (the scanner must detect a planted token)
        run: |
          set -euo pipefail
          trap 'rm -f _positive_control.py' EXIT
          TOKEN="THA$(head -c 300 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 200)"
          printf 'PLANTED = "%s"\n' "$TOKEN" > _positive_control.py
          if gitleaks dir . -c .gitleaks.toml --no-banner --redact 2>&1 | grep -q "no leaks found"; then
            echo "::error::Positive control FAILED: gitleaks did not detect a planted Threads-shaped token. The scan is blind, so the clean result above means nothing."
            exit 1
          fi
          echo "Positive control passed: the planted token was detected."

  image:
    name: Docker build + interpreter guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mcp-threads:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image ships the Python minor version we target
        # Guard rail for the digest-bump trap. Every other job in this workflow
        # runs on actions/setup-python 3.13, so nothing here ever executed the
        # *image's* interpreter. That let a Dependabot base-image bump move the
        # Dockerfile FROM tag from 3.13 to 3.14 on sister repos and ship a
        # runtime no lockfile or check had exercised, with CI fully green.
        #
        # requirements.lock is compiled with --python-version 3.13, so the image
        # must agree. --entrypoint is required: the image's ENTRYPOINT is the
        # server itself.
        run: |
          docker run --rm --entrypoint python mcp-threads:ci -c '
          import sys
          want = (3, 13)
          got = sys.version_info[:2]
          assert got == want, (
              f"image ships Python {sys.version.split()[0]}, but requirements.lock "
              f"and the CI matrix target {want[0]}.{want[1]}. Fix the Dockerfile "
              f"FROM tag, or retarget every version surface together."
          )
          print(f"image Python {sys.version.split()[0]} matches target {want[0]}.{want[1]}")
          '
