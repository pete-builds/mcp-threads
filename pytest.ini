[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# FastMCP 4 bridges the old camelCase MCP field names (readOnlyHint and
# friends) with a deprecation warning that will be removed in a later release.
# A warning in CI output is invisible; make any remaining camelCase read fail.
filterwarnings =
    error::fastmcp._warnings.FastMCPDeprecationWarning
